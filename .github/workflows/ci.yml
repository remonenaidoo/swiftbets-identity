name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    with:
      images: '[{"name": "swiftbets-identity", "dockerfile": "deploy/SwiftBets.Identity.Api.Dockerfile"}, {"name": "swiftbets-identity-migrator", "dockerfile": "deploy/SwiftBets.Identity.Migrator.Dockerfile"}]'
      coverage: true
      coverage-floors: '{"SwiftBets.Identity.Domain": {"branch": 90}, "SwiftBets.Identity.Application": {"branch": 80}}'
    permissions:
      contents: read
      packages: write
      security-events: write
